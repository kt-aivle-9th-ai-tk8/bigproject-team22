# 로컬 개발용 인프라(MySQL + Redis)만 띄운다. 애플리케이션은 IDE/`./gradlew bootRun` 으로 실행한다.
#   기동:  docker compose up -d
#   종료:  docker compose down        (데이터 유지)
#   초기화: docker compose down -v     (볼륨 삭제)
# 배포 이미지에는 포함되지 않는다(앱은 Dockerfile 로 단독 빌드/배포).
services:
  mysql:
    image: 'mysql:8.4'
    container_name: windfarmonm-mysql
    # 로컬 루프백에만 바인딩(공유 개발 호스트 노출 방지). 자격증명은 .env 로 오버라이드 가능.
    ports:
      - '127.0.0.1:3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-windfarmonm}
      MYSQL_USER: ${DB_USERNAME:-windfarmonm}
      MYSQL_PASSWORD: ${DB_PASSWORD:-windfarmonm}
      TZ: Asia/Seoul
    command: [ '--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci' ]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [ 'CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', "-p${MYSQL_ROOT_PASSWORD:-root}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: 'redis:7-alpine'
    container_name: windfarmonm-redis
    # 로컬 루프백 바인딩 + 비밀번호 인증(세션 저장소이므로 무인증 금지).
    ports:
      - '127.0.0.1:6379:6379'
    command: [ 'redis-server', '--requirepass', '${REDIS_PASSWORD:-localredis}', '--save', '', '--appendonly', 'no' ]
    healthcheck:
      test: [ 'CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-localredis}', 'ping' ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
