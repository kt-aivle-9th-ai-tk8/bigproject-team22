# 로컬 개발용 인프라(MySQL + Redis)만 띄운다. 애플리케이션은 IDE/`./gradlew bootRun` 으로 실행한다.
#   기동:  docker compose up -d
#   종료:  docker compose down        (데이터 유지)
#   초기화: docker compose down -v     (볼륨 삭제)
# 배포 이미지에는 포함되지 않는다(앱은 Dockerfile 로 단독 빌드/배포).
services:
  mysql:
    image: 'mysql:8.4'
    container_name: windfarmonm-mysql
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: windfarmonm
      MYSQL_USER: windfarmonm
      MYSQL_PASSWORD: windfarmonm
      TZ: Asia/Seoul
    command: [ '--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci' ]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [ 'CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-proot' ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: 'redis:7-alpine'
    container_name: windfarmonm-redis
    ports:
      - '6379:6379'
    command: [ 'redis-server', '--save', '', '--appendonly', 'no' ]
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
