spring:
  datasource:
    url: jdbc:mysql://localhost:3306/windfarmonm?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:windfarmonm}
    password: ${DB_PASSWORD:windfarmonm}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # 개발용 MySQL/Redis 는 docker-compose.yml 로 띄운다: `docker compose up -d`
  # 세션은 @EnableRedisHttpSession(SessionConfig) 로 활성화된다.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}