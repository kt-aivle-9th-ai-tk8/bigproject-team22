server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: windfarmonm
  profiles:
    active: ${SPRING_PROFILES_ACTIVE} # set `local` at development phase, set `prod` at production phase
  jackson:
    # 요청/응답 JSON 바디 필드를 snake_case 로 통일한다(FE 합의: 소문자 l/대문자 I 혼동 방지).
    # DTO 는 Java 관례대로 camelCase 필드를 쓰고, 직렬화/역직렬화 시 자동 변환된다.
    # (쿼리 파라미터의 @RequestParam 이름은 이 전략의 영향을 받지 않는다)
    property-naming-strategy: SNAKE_CASE
    # null 필드도 항상 응답에 포함한다("key": null). FE 가 '데이터 없음(null)'과 '값 0'을 구분하고,
    # 플래그로 꺼진 필드의 존재를 인지할 수 있도록 정책을 명시적으로 고정한다.
    default-property-inclusion: always

# 기상청(KMA) API 설정(kma.*). 대시보드 날씨(ASOS)는 KmaAsosWeatherProvider 가, AWS 관측 적재는 KmaAwsClient 가 공유한다.
# 대시보드 날씨는 발전소별 빈번 호출/호출 제한을 고려해 ASOS 관측소별 Redis 10분 TTL 캐싱을 병행한다.
kma:
  api-key: ${KMA_API_KEY:} # 미설정 시 어댑터는 빈 날씨 결과로 폴백
  base-url: ${KMA_BASE_URL:} # 예: https://apihub.kma.go.kr/api/typ01/url
  connect-timeout: ${KMA_CONNECT_TIMEOUT:3s} # KMA 전용 fail-fast(전역 spring.http.clients.* 대신 KMA 한정)
  read-timeout: ${KMA_READ_TIMEOUT:5s}