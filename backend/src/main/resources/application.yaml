server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: windfarmonm
  profiles:
    active: ${SPRING_PROFILES_ACTIVE} # set `local` at development phase, set `prod` at production phase
  jackson:
    # 요청/응답 JSON 바디 필드를 snake_case 로 통일한다(FE 합의: 소문자 l/대문자 I 혼동 방지).
    # DTO 는 Java 관례대로 camelCase 필드를 쓰고, 직렬화/역직렬화 시 자동 변환된다.
    # (쿼리 파라미터의 @RequestParam 이름은 이 전략의 영향을 받지 않는다)
    property-naming-strategy: SNAKE_CASE
    # null 필드도 항상 응답에 포함한다("key": null). FE 가 '데이터 없음(null)'과 '값 0'을 구분하고,
    # 플래그로 꺼진 필드의 존재를 인지할 수 있도록 정책을 명시적으로 고정한다.
    default-property-inclusion: always
  flyway:
    # db/migration = 스키마 + 마스터(V1~V10, 전 환경). db/seed = 대량 mock 시드(운영·로컬 전용).
    # application-test.yaml 이 이 목록을 db/migration 으로만 좁혀, CI/통합테스트에서는 91만 행 시드가 돌지 않는다.
    locations: classpath:db/migration,classpath:db/seed

# 기상청(KMA) API 설정(kma.*). 대시보드 날씨(ASOS)는 KmaAsosWeatherProvider 가 사용한다.
# 발전소별 빈번 호출/호출 제한을 고려해 ASOS 관측소별 Redis 10분 TTL 캐싱을 병행한다.
kma:
  api-key: ${KMA_API_KEY:} # 미설정 시 어댑터는 UNKNOWN 날씨로 폴백
  base-url: ${KMA_BASE_URL:} # 예: https://apihub.kma.go.kr/api/typ01/url
  connect-timeout: ${KMA_CONNECT_TIMEOUT:3s} # KMA 전용 fail-fast(전역 spring.http.clients.* 대신 KMA 한정)
  read-timeout: ${KMA_READ_TIMEOUT:5s}

# report-agent 연동(report-agent.*). 보고서 본문 생성을 위임한다(동기 호출).
# base-url 미설정 시 생성을 건너뛰고 보고서를 PENDING 으로 남긴다(앱·생성요청은 정상).
# 지금은 ALB URL 로 테스트, 이후 AWS Service Connect 내부 DNS 로 값만 교체(코드 불변).
# 주의: ALB 경유 시 ALB idle timeout(기본 60s)이 아래 read-timeout 보다 먼저 끊을 수 있다 —
#       긴 LLM 생성은 Service Connect(ALB 우회) 전환 후 안전하다.
report-agent:
  base-url: ${REPORT_AGENT_BASE_URL:}
  connect-timeout: ${REPORT_AGENT_CONNECT_TIMEOUT:3s}
  read-timeout: ${REPORT_AGENT_READ_TIMEOUT:300s} # LLM 생성이 길어 넉넉히

# AWS 연동(aws.*). 자격증명은 여기서 다루지 않는다 — 운영은 ECS Task Role, 로컬은 개발자 프로파일을
# AWS SDK 기본 자격증명 체인이 집는다. 아래 값이 비어 있으면 앱은 정상 기동하고 해당 엔드포인트만 503 이다.
aws:
  region: ${AWS_REGION:}
  s3:
    bucket: ${AWS_S3_BUCKET:} # 미설정 시 presigned URL 발급/객체 읽기가 503
    prefix: ${AWS_S3_PREFIX:content} # 키 규약: {prefix}/inspections/{inspection_id}/{blade_id}/{part_side}/...
    presign-ttl: ${AWS_S3_PRESIGN_TTL:15m} # 업로드는 다건이라 넉넉히
  sagemaker:
    anomaly-endpoint: ${AWS_SAGEMAKER_ANOMALY_ENDPOINT:} # 이상감지 Serverless Inference 엔드포인트명
    defect-endpoint: ${AWS_SAGEMAKER_DEFECT_ENDPOINT:} # 결함탐지 Async Inference 엔드포인트명. 미설정 시 릴레이가 발사 skip(아웃박스 PENDING 유지)
    invoke-timeout: ${AWS_SAGEMAKER_INVOKE_TIMEOUT:70s} # 모델 응답 상한(60s)보다 길게 — 짧으면 성공할 추론을 먼저 끊는다
  sqs:
    # 추론 결과 수신 큐(windfarm-sqs). success/error SNS 토픽이 raw delivery 로 넣는다. 미설정 시 폴러 skip.
    result-queue-url: ${AWS_SQS_RESULT_QUEUE_URL:}

# 스케줄러 분산 락. 여러 환경이 같은 Redis 를 공유할 수 있으므로 키 접두어를 환경별로 다르게 주입한다
# (고정값이면 스테이징 배치가 운영 배치를 막는다). 기본값은 로컬 개발용이다.
scheduling:
  lock:
    key-prefix: ${SCHEDULING_LOCK_KEY_PREFIX:windfarmonm-local}

# 이상감지 배치. 기본 비활성이며 운영에서만 켠다.
# (테스트/로컬에서 켜지면 매시각 SageMaker 를 호출하게 되므로 opt-in 으로 둔다)
anomaly:
  scheduler:
    enabled: ${ANOMALY_SCHEDULER_ENABLED:false}