server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: windfarmonm
  profiles:
    active: ${SPRING_PROFILES_ACTIVE} # set `local` at development phase, set `prod` at production phase
  jackson:
    # 요청/응답 JSON 바디 필드를 snake_case 로 통일한다(FE 합의: 소문자 l/대문자 I 혼동 방지).
    # DTO 는 Java 관례대로 camelCase 필드를 쓰고, 직렬화/역직렬화 시 자동 변환된다.
    # (쿼리 파라미터의 @RequestParam 이름은 이 전략의 영향을 받지 않는다)
    property-naming-strategy: SNAKE_CASE
    # null 필드도 항상 응답에 포함한다("key": null). FE 가 '데이터 없음(null)'과 '값 0'을 구분하고,
    # 플래그로 꺼진 필드의 존재를 인지할 수 있도록 정책을 명시적으로 고정한다.
    default-property-inclusion: always

# 기상청(KMA) API 설정(kma.*). 대시보드 날씨(ASOS)는 KmaAsosWeatherProvider 가 사용한다.
# 발전소별 빈번 호출/호출 제한을 고려해 ASOS 관측소별 Redis 10분 TTL 캐싱을 병행한다.
kma:
  api-key: ${KMA_API_KEY:} # 미설정 시 어댑터는 UNKNOWN 날씨로 폴백
  base-url: ${KMA_BASE_URL:} # 예: https://apihub.kma.go.kr/api/typ01/url
  connect-timeout: ${KMA_CONNECT_TIMEOUT:3s} # KMA 전용 fail-fast(전역 spring.http.clients.* 대신 KMA 한정)
  read-timeout: ${KMA_READ_TIMEOUT:5s}

# AWS 연동(aws.*). 자격증명은 여기서 다루지 않는다 — 운영은 ECS Task Role, 로컬은 개발자 프로파일을
# AWS SDK 기본 자격증명 체인이 집는다. 아래 값이 비어 있으면 앱은 정상 기동하고 해당 엔드포인트만 503 이다.
aws:
  region: ${AWS_REGION:}
  s3:
    bucket: ${AWS_S3_BUCKET:} # 미설정 시 presigned URL 발급/객체 읽기가 503
    prefix: ${AWS_S3_PREFIX:content} # 키 규약: {prefix}/inspections/{inspection_id}/{blade_id}/{part_side}/...
    presign-ttl: ${AWS_S3_PRESIGN_TTL:15m} # 업로드는 다건이라 넉넉히
  sagemaker:
    anomaly-endpoint: ${AWS_SAGEMAKER_ANOMALY_ENDPOINT:} # 이상감지 Serverless Inference 엔드포인트명

# 이상감지 배치. 기본 비활성이며 운영에서만 켠다.
# (테스트/로컬에서 켜지면 매시각 SageMaker 를 호출하게 되므로 opt-in 으로 둔다)
anomaly:
  scheduler:
    enabled: ${ANOMALY_SCHEDULER_ENABLED:false}