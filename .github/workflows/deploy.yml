# ECR push + ECS 배포 + S3 배포 + CloudFront 캐시 무효화

name: Deploy Services (ECS & S3)

on:
  push:
    branches:
      - develop

permissions:
  id-token: write
  contents: read

jobs:
  # ----------------------------------------------------
  # 변경점 탐지 Job
  # ----------------------------------------------------
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      ## 각 Job에서 사용할 수 있도록 outputs 설정
      backend: ${{ steps.filter.outputs.backend }}
      anomaly-service: ${{ steps.filter.outputs.anomaly-service }}
      report-agent: ${{ steps.filter.outputs.report-agent }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Paths Filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend: 'backend/**'
            anomaly-service: 'anomaly-service/**'
            report-agent: 'report-agent-service/**'
            frontend: 'frontend/**'

  # **************************************************** #
  # 1. Spring boot 배포 Job
  deploy-backend:
    needs: detect-changes
    ## 조건: backend 폴더에 변경점이 있는 경우에만 실행
    if: ${{ needs.detect-changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      ### Spring Boot용 Gradle 빌드 및 Docker Push 세팅
      - name: Set up JDK 20
        uses: actions/setup-java@v4
        with:
          java-version: '20'
          distribution: 'temurin'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::336090301989:role/windfarm-onm-deploy-role
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      ### Gradle 빌드 후 Docker 이미지 빌드 및 Push
      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/windfarm-onm-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 2. FastAPI(이상감지) 배포 Job
  deploy-anomaly-service:
    needs: detect-changes
    ## 조건: anomaly-service 폴더에 변경점이 있는 경우에만 실행
    if: ${{ needs.detect-changes.outputs.anomaly-service == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./anomaly-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::336090301989:role/windfarm-onm-deploy-role
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2  

      - name: Build & Push Anomaly Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./anomaly-service
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/windfarm-onm-anomaly:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3. FastAPI(리포트) 배포 Job
  deploy-report-agent:
    needs: detect-changes
    ## 조건: report-agent 폴더에 변경점이 있는 경우에만 실행
    if: ${{ needs.detect-changes.outputs.report-agent == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./report-agent-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::336090301989:role/windfarm-onm-deploy-role
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Report Agent Image
        uses: docker/build-push-action@v5
        with:
          context: ./report-agent-service
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/windfarm-onm-report-agent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 4. React 배포 Job
  deploy-frontend: 
    needs: detect-changes
    ## 조건: frontend 폴더에 변경점이 있는 경우에만 실행
    if: ${{ needs.detect-changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies & Build
        run: |
          npm ci
          npm run build
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::336090301989:role/windfarm-onm-deploy-role
          aws-region: ap-northeast-2

      # 빌드 결과물(dist 또는 build)을 S3로 업로드
      - name: Deploy to S3
        run: |
          aws s3 sync ./dist s3://${{ secrets.S3_BUCKET_NAME }} --delete

      # CloudFront 캐시 무효화 (사용자가 즉시 최신 웹페이지를 보도록 설정)
      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
