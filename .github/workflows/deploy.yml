# ECR push + ECS 배포 + S3 배포 + CloudFront 캐시 무효화

name: Deploy Services (ECS & S3)

on:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  # ----------------------------------------------------
  # 변경점 탐지 Job
  # ----------------------------------------------------
  detect-changes:
    runs-on: ubuntu-slim
    outputs:
      ## 각 Job에서 사용할 수 있도록 outputs 설정
      backend: ${{ steps.filter.outputs.backend }}
      report_agent: ${{ steps.filter.outputs.report_agent }}
      frontend: ${{ steps.filter.outputs.frontend }}
      serving_ml: ${{ steps.filter.outputs.serving_ml }}
      serving_dl: ${{ steps.filter.outputs.serving_dl }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Paths Filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.ref_name }}
          filters: |
            backend: 'backend/**'
            report_agent: 'report-agent-service/**'
            frontend: 'frontend/**'
            serving_ml: 'serving/ml/**'
            serving_dl: 'serving/dl/**'

  # **************************************************** #
  # 1. Spring boot 배포 Job
  deploy-backend:
    needs: detect-changes
    ## 조건: backend 폴더에 변경점이 있는 경우에만 실행
    if: ${{ needs.detect-changes.outputs.backend == 'true' }}
    concurrency:
      group: deploy-backend-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      ### Spring Boot용 Gradle 빌드 및 Docker Push 세팅
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::336090301989:role/windfarm-onm-github-actions-role
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      ### Gradle 빌드 후 Docker 이미지 빌드 및 Push
      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/windfarm-onm-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      ### ECS Task Definition에 새 이미지 주소 덮어쓰기
      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ./backend/task-definition.json 
          container-name: windfarm-onm-backend-container  # ECS Task 안의 컨테이너 이름
          image: ${{ steps.login-ecr.outputs.registry }}/windfarm-onm-backend:${{ github.sha }}

      ### 갱신된 Task Definition으로 ECS 서비스 업데이트 (Rollout)
      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: windfarm-onm-backend-service
          cluster: windfarm-onm-cluster           
          wait-for-service-stability: true        

  # FastAPI(리포트) 배포 Job
  deploy-report-agent:
    needs: detect-changes
    ## 조건: report-agent 폴더에 변경점이 있는 경우에만 실행
    if: ${{ needs.detect-changes.outputs.report_agent == 'true' }}
    concurrency:
      group: deploy-report-agent-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ./report-agent-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::336090301989:role/windfarm-onm-github-actions-role 
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Report Agent Image
        uses: docker/build-push-action@v5
        with:
          context: ./report-agent-service
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/windfarm-onm-report-agent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def-report
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ./report-agent-service/task-definition.json
          container-name: windfarm-onm-report-agent-container
          image: ${{ steps.login-ecr.outputs.registry }}/windfarm-onm-report-agent:${{ github.sha }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def-report.outputs.task-definition }}
          service: windfarm-onm-report-agent-service
          cluster: windfarm-onm-cluster
          wait-for-service-stability: true

  # React 배포 Job
  deploy-frontend: 
    needs: detect-changes
    ## 조건: frontend 폴더에 변경점이 있는 경우에만 실행
    if: ${{ needs.detect-changes.outputs.frontend == 'true' }}
    concurrency:
      group: deploy-frontend-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies & Build
        run: |
          npm ci
          npm run build
        env:
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          VITE_VWORLD_API_KEY: ${{ secrets.VITE_VWORLD_API_KEY }}
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::336090301989:role/windfarm-onm-github-actions-role
          aws-region: ap-northeast-2

      ### 빌드 결과물(dist 또는 build)을 S3로 업로드
      - name: Deploy to S3
        run: |
          aws s3 sync ./dist s3://${{ secrets.S3_BUCKET_NAME }} --delete

      ### CloudFront 캐시 무효화 (사용자가 즉시 최신 웹페이지를 보도록 설정)
      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"

  # **************************************************** #
  # SageMaker 서빙 배포 Job
  deploy-model-serving-ml:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.serving_ml == 'true' }}
    concurrency:
      group: deploy-model-serving-ml-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ./serving/ml
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::336090301989:role/windfarm-onm-github-actions-role
          aws-region: ap-northeast-2

      ## 코드 패키징
      - name: Package sourcedir
        run: |
          tar -czvf sourcedir.tar.gz inference.py predict.py density.py requirements.txt

      - name: Upload to S3
        run: |
          aws s3 cp sourcedir.tar.gz s3://${{ secrets.S3_BUCKET_NAME }}/code/lightgbm/sourcedir.tar.gz

    # SageMaker 모델 배포 (dl/)
  deploy-model-serving-dl:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.serving_dl == 'true' }}
    concurrency:
      group: deploy-model-serving-dl-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ./serving/dl
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::336090301989:role/windfarm-onm-github-actions-role
          aws-region: ap-northeast-2

      ## 코드 패키징
      - name: Package sourcedir
        run: |
          tar -czvf sourcedir.tar.gz inference.py requirements.txt

      - name: Upload to S3
        run: |
          aws s3 cp sourcedir.tar.gz s3://${{ secrets.S3_BUCKET_NAME }}/code/blade-defect-pipeline/sourcedir.tar.gz