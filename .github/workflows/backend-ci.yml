# Spring boot(백엔드) 빌드-테스트

name: Backend CI

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'backend/**'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build and Test with Gradle
        # 배포 없이 빌드와 테스트만 수행하여 코드 안정성 검증
        run: ./gradlew build
